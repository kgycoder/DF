name: Android CI

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 경로 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비 (선택 사항)
        # secrets 가 없으면 아무 것도 하지 않고, release APK 는 디버그 키로 서명된다.
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 단위 테스트
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/build.log

      - name: APK 빌드
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee -a /tmp/build.log

      - name: UI 스크린샷 갱신
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          if ls app/build/screenshots/*.png > /dev/null 2>&1; then
            mkdir -p docs/screenshots
            cp app/build/screenshots/*.png docs/screenshots/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots
            if ! git diff --cached --quiet; then
              git commit -m "docs: UI 스크린샷 갱신 [skip ci]"
              git push
            fi
          fi

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: gounmal-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 태그라면 릴리스 생성
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: 실패 로그를 PR 에 남기기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json number --jq '.[0].number' 2>/dev/null || true)
          LOG=$(tail -c 30000 /tmp/build.log 2>/dev/null || echo "빌드 로그를 읽지 못했습니다.")
          BODY=$(printf '### 빌드 실패 로그\n\n```\n%s\n```\n' "$LOG")
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body "$BODY"
          else
            echo "$BODY"
          fi
